[workspace]
resolver = "2"
members = [
    "crates/spendguard-policy",
    "contracts/spendguard",
    "tools/spendguard-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/arya161100/spendguard-agent"
publish = false

# Tight release settings for a smaller WASM blob. The CLI also uses this
# profile; do not set panic = "abort" here so the CLI can unwind.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
overflow-checks = true
